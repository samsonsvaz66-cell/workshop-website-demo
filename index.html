<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcomGyan Masterclass | Offline Ecommerce Operations & Growth Workshop</title>
    <meta name="description" content="Discover and register for the upcoming in-person EcomGyan workshop. Actionable masterclasses for active store owners and brand operators." />
    
    <!-- Google Fonts: Outfit (Display & Headlines) and Plus Jakarta Sans (Body & Labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme initialization script to prevent FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('ecomgyan-theme');
          if (storedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            // Default to dark mode
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>

    <link rel="stylesheet" crossorigin href="/workshop-website-demo/assets/index-BTW7hH9S.css">
  </head>
